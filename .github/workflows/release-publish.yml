name: Release and Publish

on:
  push:
    branches:
      - main

jobs:
  check-version-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for version change
        id: check
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_RESULT=$(git diff HEAD~1 HEAD -- projects/ngx-products-3d/package.json | grep '"version":' || true)
          else
            DIFF_RESULT=$(grep '"version":' projects/ngx-products-3d/package.json || true)
          fi
          if [ -n "$DIFF_RESULT" ]; then
            VERSION=$(grep '"version":' projects/ngx-products-3d/package.json | sed 's/.*"version": "\(.*\)",/\1/')
            echo "Version changed to: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No version change detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: Release v${{ steps.check.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: check-version-and-release
    if: needs.check-version-and-release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # ← nuevo: permite el intercambio OIDC
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'     # ← npm 11 (OIDC requiere >= 11.5.1)
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib

      - name: Publish to npm
        run: |
          cp LICENSE dist/ngx-products-3d/
          cd dist/ngx-products-3d && npm publish --access public
        # ← sin NODE_AUTH_TOKEN
